i){const p=data.inventory[i],v=prompt(`Stock adjustment for ${p.name}. Use positive for stock in and negative for stock out.`,1);if(v!==null&&!isNaN(+v)){p.qty=Math.max(0,p.qty+(+v));save();render();toast('Stock updated')}}function printBill(no){const b=data.bills.find(x=>x.no===no);if(!b)return;const w=window.open('','_blank','width=360,height=720');if(!w){toast('Allow pop-ups to print the bill');return}const itemRows=(b.lines||[]).map(x=>`<tr><td class="item-name">${esc(x.name)}</td><td class="qty">${Number(x.qty)||1}</td><td class="amount">${money((Number(x.price)||0)*(Number(x.qty)||1))}</td></tr>`).join('')||`<tr><td class="item-name">${esc(b.items||'Services')}</td><td class="qty">1</td><td class="amount">${money(b.subtotal??b.total)}</td></tr>`;w.document.write(`<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(b.no)}</title><style>@page{size:80mm auto;margin:3mm}*{box-sizing:border-box}html,body{margin:0;padding:0;width:74mm;color:#171717;font:11px Arial,sans-serif}body{padding:2mm 1mm}h1{font-size:20px;letter-spacing:2px;text-align:center;margin:0 0 2px}.sub{text-align:center;font-size:10px;letter-spacing:1px;margin-bottom:9px}.center{text-align:center}.muted{color:#555;font-size:10px}.rule{border:0;border-top:1px dashed #555;margin:8px 0}.meta{display:flex;justify-content:space-between;gap:5px;margin:3px 0}.meta span:first-child{color:#555}.meta b{text-align:right;overflow-wrap:anywhere}table{width:100%;border-collapse:collapse;margin:8px 0}th{font-size:9px;text-transform:uppercase;color:#555;border-bottom:1px dashed #555;padding:4px 1px;text-align:left}td{padding:5px 1px;vertical-align:top;border-bottom:1px dotted #bbb}.item-name{width:58%;overflow-wrap:anywhere}.qty{text-align:center;width:10%}.amount{text-align:right;width:32%;white-space:nowrap}.total{font-size:14px;font-weight:bold}.thanks{text-align:center;margin:10px 0 2px;font-weight:bold}.footer{text-align:center;font-size:9px;color:#555;margin-top:4px}@media print{html,body{width:74mm}body{padding:0}}</style></head><body><h1>TRIMZ</h1><div class="sub">UNISEX SALON</div><hr class="rule"><div class="meta"><span>Bill</span><b>${esc(b.no)}</b></div><div class="meta"><span>Date / time</span><b>${esc(b.date||todayIso())} ${esc(b.time||'')}</b></div><div class="meta"><span>Customer</span><b>${esc(b.customer||'Walk-in customer')}</b></div>${b.phone?`<div class="meta"><span>Mobile</span><b>${esc(b.phone)}</b></div>`:''}<hr class="rule"><table><thead><tr><th>Item</th><th class="qty">Qty</th><th class="amount">Amount</th></tr></thead><tbody>${itemRows}</tbody></table><hr class="rule"><div class="meta"><span>Subtotal</span><b>${money(b.subtotal??b.total)}</b></div><div class="meta"><span>Discount</span><b>− ${money(b.discount||0)}</b></div><div class="meta"><span>${b.gstIncluded?'GST ('+(b.gstRate??5)+'%)':'GST'}</span><b>${b.gstIncluded?money(b.tax||0):'Not applied'}</b></div><hr class="rule"><div class="meta total"><span>Total paid</span><b>${money(b.total)}</b></div><div class="meta"><span>Payment</span><b>${esc(b.mode||'—')}</b></div><div class="thanks">Thank you for visiting!</div><div class="footer">We look forward to seeing you again.<br>TRIMZ UNISEX SALON</div><script>window.print()<\/script></body></html>`);w.document.close()}
